services:
  - type: web
    name: private-chat
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: INVITE_CODE
        sync: false
      - key: DB_PATH
        value: /var/data/data.sqlite
    disk:
      name: private-chat-data
      mountPath: /var/data
      sizeGB: 1
