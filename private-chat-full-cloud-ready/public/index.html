<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Workspace</title>
<style>
:root{--bg:#080b10;--panel:#10151c;--panel2:#151c25;--line:#26313d;--text:#f5f7fa;--muted:#8995a4;--accent:#cfd6df;--good:#45d483;--danger:#ff6f7d;--shadow:0 20px 60px rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:radial-gradient(circle at 20% 0,#18202b 0,#080b10 45%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.shell{height:100vh;display:flex;overflow:hidden}.login{width:min(440px,calc(100% - 32px));margin:auto;background:rgba(16,21,28,.94);border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:var(--shadow)}.brand{font-size:21px;font-weight:800;letter-spacing:.2px}.sub{color:var(--muted);margin:8px 0 26px}.field{display:grid;gap:7px;margin:12px 0}.field label{color:#aab5c2;font-size:12px}.input,select{width:100%;background:#0b1016;color:var(--text);border:1px solid #2a3541;border-radius:12px;padding:12px 13px;outline:none}.input:focus,select:focus{border-color:#738191;box-shadow:0 0 0 3px rgba(160,170,185,.08)}button{border:1px solid #303b47;background:#111821;color:#eaf0f5;border-radius:11px;padding:10px 13px;cursor:pointer}button:hover{filter:brightness(1.12)}button.primary{background:#e9edf2;color:#0a0d11;border-color:transparent;font-weight:800}.full{width:100%}.error{color:#ff9da7;min-height:20px;margin-top:8px}.app{width:100%;display:grid;grid-template-columns:300px minmax(0,1fr);height:100vh}.sidebar{background:rgba(12,16,22,.94);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}.sidehead{padding:18px;border-bottom:1px solid var(--line)}.sidebrand{display:flex;align-items:center;justify-content:space-between;gap:8px}.me{font-size:12px;color:var(--muted);margin-top:5px}.userlist{overflow:auto;padding:8px}.user{width:100%;display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:12px;border:0;background:transparent;text-align:left}.user.active{background:#1a222c}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#202a35;font-weight:800;flex:none}.udata{min-width:0;flex:1}.uname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.statusline{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11px;margin-top:3px}.dot{width:8px;height:8px;border-radius:50%;background:#56606c}.dot.on{background:var(--good);box-shadow:0 0 0 3px rgba(69,212,131,.09)}.sidefoot{padding:12px;border-top:1px solid var(--line)}.main{min-width:0;display:flex;flex-direction:column}.chathead{height:72px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);background:rgba(12,16,22,.72)}.peername{font-weight:800}.peerstatus{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap}.messages{flex:1;overflow:auto;padding:20px clamp(14px,4vw,50px);display:flex;flex-direction:column;gap:8px}.empty{margin:auto;text-align:center;color:var(--muted)}.bubble{max-width:min(70%,680px);padding:10px 13px;border:1px solid #293440;background:#141b24;border-radius:16px 16px 16px 5px;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.me{align-self:flex-end;background:#e9edf2;color:#0b0f14;border-color:transparent;border-radius:16px 16px 5px 16px}.meta{font-size:10px;opacity:.55;margin-top:5px}.composer{padding:12px 16px;border-top:1px solid var(--line);background:rgba(12,16,22,.9);display:flex;gap:8px}.composer .input{flex:1}.admin{border-bottom:1px solid var(--line);padding:12px 16px;background:#0d131a}.adminrow{display:flex;gap:8px;flex-wrap:wrap}.adminrow>*{flex:1;min-width:130px}.adminlog{margin-top:10px;display:grid;gap:5px}.toastbox{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:20}.toast{background:#171f29;border:1px solid #35414e;border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);max-width:330px;cursor:pointer}.callmodal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;z-index:30}.callcard{width:min(720px,calc(100% - 28px));background:#10161e;border:1px solid #33404e;border-radius:20px;padding:16px;box-shadow:var(--shadow)}.videos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.videos video{width:100%;background:#05070a;border-radius:14px;aspect-ratio:16/10;object-fit:cover}.callbuttons{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.badge{font-size:10px;border:1px solid #36424f;border-radius:99px;padding:3px 7px;color:#aeb9c6}.mobilebar{display:none}
@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{position:absolute;inset:0 0 0 auto;width:88%;max-width:330px;z-index:15;transform:translateX(100%);transition:.2s}.sidebar.open{transform:translateX(0)}.mobilebar{display:block}.chathead{height:64px}.bubble{max-width:86%}.videos{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="loginView" class="shell"><div class="login"><div class="brand">Secure Workspace</div><div class="sub">Sign in to continue.</div><div class="field"><label>Username</label><input id="lu" class="input" autocomplete="username"></div><div class="field"><label>Password</label><input id="lp" class="input" type="password" autocomplete="current-password"></div><button class="primary full" onclick="login()">Sign in</button><div id="loginErr" class="error"></div></div></div>
<div id="appView" class="app hidden">
  <aside id="sidebar" class="sidebar"><div class="sidehead"><div class="sidebrand"><div><div class="brand">Workspace</div><div id="who" class="me"></div></div><button onclick="logout()">Log out</button></div></div><div id="userlist" class="userlist"></div><div class="sidefoot"><button class="full" onclick="refreshUsers()">Refresh</button></div></aside>
  <main class="main"><header class="chathead"><div style="min-width:0"><button class="mobilebar" onclick="toggleSide()">☰</button> <span id="peerName" class="peername">Select a person</span><div id="peerStatus" class="peerstatus"></div></div><div class="actions"><button id="voiceBtn" onclick="startCall(false)" disabled>☎ Voice</button><button id="videoBtn" onclick="startCall(true)" disabled>▣ Video</button></div></header>
    <section id="adminPanel" class="admin hidden"><div class="badge">ADMIN MONITOR</div><div class="adminrow" style="margin-top:8px"><select id="adminA" class="input"></select><select id="adminB" class="input"></select><button onclick="loadAdminChat()">View conversation</button></div><div id="adminUsers" class="adminlog"></div><div id="adminlog" class="adminlog"></div></section>
    <section id="messages" class="messages"><div class="empty">Choose a person to start.</div></section>
    <form class="composer" onsubmit="event.preventDefault();send()"><input id="msg" class="input" placeholder="Write a message…" autocomplete="off"><input id="file" type="file" class="hidden" onchange="upload()"><button type="button" onclick="$('file').click()">＋</button><button id="sendBtn" class="primary" type="submit" disabled>Send</button></form>
  </main>
</div>
<div id="toastbox" class="toastbox"></div>
<div id="callModal" class="callmodal hidden"><div class="callcard"><div id="callTitle" class="brand">Call</div><div id="callHint" class="sub" style="margin-bottom:8px">Connecting…</div><div class="videos"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video></div><div class="callbuttons"><button onclick="endCall()">End call</button></div></div></div>
<script src="/socket.io/socket.io.js"></script>
<script>
let me=null,role=null,sock=null,currentPeer=null,peerConn=null,localStream=null,incomingFrom=null,isVideo=false;
const $=id=>document.getElementById(id);
const APP_BASE=location.pathname.replace(/\/$/,'');
async function api(u,o={}){const opts={...o,headers:{...(o.headers||{})}};if(opts.body && !(opts.body instanceof FormData))opts.headers['Content-Type']='application/json';const r=await fetch(u,opts);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function initials(s){return String(s||'?').slice(0,1).toUpperCase()}
async function login(){ $('loginErr').textContent='';try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})});me=d.user.username;role=d.user.role;$('who').textContent=me;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');if(role==='admin')$('adminPanel').classList.remove('hidden');await refreshUsers();await connectSocket();}catch(e){$('loginErr').textContent=e.message}}
async function connectSocket(){const st=await api('/api/socket-token');sock=io({auth:{token:st.token},transports:['websocket','polling']});sock.on('connect',()=>{ $('sendBtn').disabled=!currentPeer; $('voiceBtn').disabled=!currentPeer; $('videoBtn').disabled=!currentPeer; toast('Connected','You are online.');});sock.on('disconnect',()=>{$('sendBtn').disabled=true;$('voiceBtn').disabled=true;$('videoBtn').disabled=true;toast('Connection lost','Trying to reconnect…')});sock.on('connect_error',e=>toast('Connection error',e.message));sock.on('presence:update',x=>updatePresence(x.username,x.online));sock.on('chat:message',m=>{if(m.fromUser===currentPeer||m.toUser===currentPeer){render(m)}else if(m.fromUser!==me){toast('New message',`${m.fromUser}: ${m.text.slice(0,90)}`,()=>selectPeer(m.fromUser))}});sock.on('call:signal',signal);setInterval(()=>sock?.connected&&sock.emit('presence:heartbeat'),20000)}
async function refreshUsers(){const list=await api('/api/users');renderUsers(list);if(role==='admin'){fillAdminSelects(list);renderAdminUsers(list)}}
function renderUsers(list){$('userlist').innerHTML=list.filter(x=>x.username!==me).map(x=>`<button class="user ${x.username===currentPeer?'active':''}" onclick="selectPeer('${encodeURIComponent(x.username)}')"><span class="avatar">${initials(x.displayName)}</span><span class="udata"><span class="uname">${esc(x.displayName)}</span><span class="statusline"><i id="dot-${esc(x.username)}" class="dot ${x.online?'on':''}"></i>${x.online?'Online':(x.lastSeenAt?'Last seen '+timeAgo(x.lastSeenAt):'Offline')}</span></span></button>`).join('')||'<div class="empty" style="padding:30px 10px">No other users yet.</div>'}
function renderAdminUsers(list){$('adminUsers').innerHTML='<div class="badge">USER DEVICES / ACTIVITY</div>'+list.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #222b35"><b>${esc(x.displayName)}</b> <span class="badge">${x.online?'ONLINE':'OFFLINE'}</span><div class="meta" style="margin-top:4px">${esc(x.device||'Unknown device')} · ${x.ip?esc(x.ip):'IP unavailable'} · ${x.lastLoginAt?'login '+new Date(x.lastLoginAt).toLocaleString():'never logged in'} · ${x.lastSeenAt?'seen '+timeAgo(x.lastSeenAt):'no activity'}</div></div>`).join('')||'<div class="sub">No users.</div>'}function fillAdminSelects(list){const opts=list.map(x=>`<option value="${esc(x.username)}">${esc(x.displayName)} (${esc(x.username)})</option>`).join('');$('adminA').innerHTML=opts;$('adminB').innerHTML=opts;if(list.length>1)$('adminB').selectedIndex=1}
function updatePresence(u,on){const dot=$('dot-'+u);if(dot){dot.classList.toggle('on',on);dot.parentElement.lastChild.textContent=on?'Online':'Offline'}if(u===currentPeer)$('peerStatus').textContent=on?'Online':'Offline';}
async function selectPeer(enc){const p=decodeURIComponent(enc);currentPeer=p;$('sidebar').classList.remove('open');$('peerName').textContent=p;$('peerStatus').textContent='Loading…';$('sendBtn').disabled=!sock?.connected;$('voiceBtn').disabled=!sock?.connected;$('videoBtn').disabled=!sock?.connected;renderUsers(await api('/api/users'));const rows=await api('/api/messages/'+encodeURIComponent(p));$('messages').innerHTML='';rows.forEach(render);const users=await api('/api/users');const u=users.find(x=>x.username===p);$('peerStatus').textContent=u?.online?'Online':(u?.lastSeenAt?'Last seen '+timeAgo(u.lastSeenAt):'Offline')}
function render(m){const d=document.createElement('div');d.className='bubble '+(m.fromUser===me?'me':'');const t=new Date(m.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.innerHTML=`<div>${esc(m.text)}</div><div class="meta">${m.fromUser===me?'You':esc(m.fromUser)} · ${t}</div>`;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function send(){const text=$('msg').value.trim();if(!text||!currentPeer||!sock?.connected)return;const btn=$('sendBtn');btn.disabled=true;sock.emit('chat:send',{to:currentPeer,text},ack=>{btn.disabled=false;if(!ack?.ok)toast('Message failed',ack?.error||'Please try again.');else $('msg').value=''})}
async function upload(){const f=$('file').files[0];if(!f||!currentPeer)return;try{const fd=new FormData();fd.append('file',f);const d=await api('/api/upload',{method:'POST',body:fd});sendText('📎 '+d.filename+' — '+location.origin+d.url)}catch(e){toast('Upload failed',e.message)}$('file').value=''}
function sendText(text){if(sock?.connected)sock.emit('chat:send',{to:currentPeer,text},a=>{if(!a?.ok)toast('Send failed',a?.error||'Retry')})}
function toast(title,text,click){const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${esc(title)}</b><div style="color:#aeb8c4;margin-top:3px">${esc(text)}</div>`;if(click)d.onclick=()=>{click();d.remove()};$('toastbox').appendChild(d);setTimeout(()=>d.remove(),5000)}
function timeAgo(ts){const sec=Math.max(0,Math.floor((Date.now()-ts)/1000));if(sec<60)return'just now';if(sec<3600)return Math.floor(sec/60)+'m ago';if(sec<86400)return Math.floor(sec/3600)+'h ago';return Math.floor(sec/86400)+'d ago'}
function toggleSide(){$('sidebar').classList.toggle('open')}
async function loadAdminChat(){const a=$('adminA').value,b=$('adminB').value;if(!a||!b||a===b){$('adminlog').textContent='Choose two different users.';return}const rows=await api('/api/admin/messages/'+encodeURIComponent(a)+'/'+encodeURIComponent(b));$('adminlog').innerHTML=`<div class="badge">${esc(a)} ↔ ${esc(b)} · ${rows.length} messages</div>`+rows.map(m=>`<div class="bubble ${m.fromUser===a?'':'me'}" style="max-width:100%"><div>${esc(m.text)}</div><div class="meta">${esc(m.fromUser)} · ${new Date(m.createdAt).toLocaleString()}</div></div>`).join('')||'<div class="sub">No messages.</div>'}
async function startCall(video){if(!currentPeer||!sock?.connected)return;isVideo=video;incomingFrom=currentPeer;try{await openMedia(video);createPeer();const offer=await peerConn.createOffer();await peerConn.setLocalDescription(offer);showCall('Calling '+currentPeer,video,false);sock.emit('call:signal',{to:currentPeer,data:{type:'offer',sdp:offer.sdp,video}})}catch(e){toast('Call unavailable',e.message);endCall()}}
async function openMedia(video){localStream=await navigator.mediaDevices.getUserMedia({audio:true,video});$('localVideo').srcObject=localStream}
function createPeer(){peerConn=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});localStream?.getTracks().forEach(t=>peerConn.addTrack(t));peerConn.onicecandidate=e=>{if(e.candidate&&incomingFrom)sock.emit('call:signal',{to:incomingFrom,data:{type:'candidate',candidate:e.candidate}})};peerConn.ontrack=e=>{$('remoteVideo').srcObject=e.streams[0]};peerConn.onconnectionstatechange=()=>{if(peerConn.connectionState==='connected')$('callHint').textContent='Connected';if(['failed','disconnected','closed'].includes(peerConn.connectionState)){$('callHint').textContent='Connection ended'}}}
async function signal(x){try{if(x.data?.type==='offer'){pendingOffer=x.data;incomingFrom=x.from;isVideo=!!x.data.video;showCall(x.from+' is calling',isVideo,true);return}if(x.data?.type==='answer'){if(peerConn)await peerConn.setRemoteDescription({type:'answer',sdp:x.data.sdp});return}if(x.data?.type==='candidate'){if(peerConn)await peerConn.addIceCandidate(x.data.candidate)}}catch(e){toast('Call error',e.message)}}
async function acceptCall(){if(!pendingOffer||!incomingFrom)return;try{currentPeer=incomingFrom;await openMedia(isVideo);createPeer();await peerConn.setRemoteDescription({type:'offer',sdp:pendingOffer.sdp});const answer=await peerConn.createAnswer();await peerConn.setLocalDescription(answer);sock.emit('call:signal',{to:incomingFrom,data:{type:'answer',sdp:answer.sdp}});pendingOffer=null;$('callHint').textContent='Connecting…'}catch(e){toast('Call failed',e.message);endCall()}}
let pendingOffer=null;
function showCall(title,video,incoming=false){$('callTitle').textContent=title;$('callHint').innerHTML=incoming?'<button class="primary" onclick="acceptCall()">Answer</button> <button onclick="endCall()">Decline</button>':'Connecting…';$('callModal').classList.remove('hidden');$('localVideo').style.display=video?'block':'none';$('remoteVideo').style.display=video?'block':'none'}
function endCall(){try{localStream?.getTracks().forEach(t=>t.stop())}catch{}try{peerConn?.close()}catch{}localStream=null;peerConn=null;incomingFrom=null;pendingOffer=null;$('localVideo').srcObject=null;$('remoteVideo').srcObject=null;$('callModal').classList.add('hidden')}
async function logout(){try{await api('/api/logout',{method:'POST'})}finally{location.reload()}}
$('lp').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body></html>
