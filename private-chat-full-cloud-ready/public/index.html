<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Chat</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e12;color:#eef2f6;font:15px system-ui}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#151a20;border:1px solid #29313a;border-radius:20px;padding:18px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.input,button,select{background:#0d1116;color:#fff;border:1px solid #303943;border-radius:12px;padding:11px}.primary{background:#dce1e6;color:#101318;border:0;font-weight:700}.hide{display:none}.top{display:flex;justify-content:space-between;align-items:center}.messages{height:50vh;overflow:auto;background:#0d1014;border-radius:14px;padding:10px}.bubble{background:#202731;padding:10px 13px;border-radius:15px;margin:7px 0;max-width:78%}.me{margin-left:auto;background:#dce1e6;color:#101318}.muted{color:#8d98a5;font-size:12px}.danger{color:#ff9b9b}.panel{margin-top:10px}
</style></head><body><div class="wrap"><div class="top"><h2>Private Chat</h2><span id="status" class="muted">Offline</span></div>
<div id="login" class="card"><h3>Sign in</h3><div class="row"><input id="lu" class="input" placeholder="Username"><input id="lp" class="input" type="password" placeholder="Password"><button class="primary" onclick="login()">Login</button></div><p class="muted">Private service — use HTTPS in production.</p></div>
<div id="app" class="hide"><div class="card top"><b id="who"></b><button onclick="logout()">Logout</button></div>
<div id="admin" class="card hide"><h3>Admin — Add user</h3><div class="row"><input id="nu" class="input" placeholder="Username"><input id="np" class="input" placeholder="Password"><input id="nd" class="input" placeholder="Display name"><button class="primary" onclick="addUser()">Add user</button></div><div id="users"></div></div>
<div class="card"><div class="row"><select id="peer" class="input"></select><button onclick="openChat()">Open</button><button onclick="call(false)">☎ Voice</button><button onclick="call(true)">▣ Video</button><button onclick="shareLoc()">📍 Share location</button></div><div id="messages" class="messages"></div><div class="row panel"><input id="msg" class="input" style="flex:1" placeholder="Message" onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">Send</button><input id="file" type="file" onchange="upload()"></div></div></div></div>
<script src="/socket.io/socket.io.js"></script><script>
let me=null,role=null,sock=null,peerConn=null,localStream=null;
const $=x=>document.getElementById(x);
async function api(u,o={}){o.headers={...(o.headers||{}),...(o.body instanceof FormData?{}:{'Content-Type':'application/json'})};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
async function login(){try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('lu').value,password:$('lp').value})});me=d.user.username;role=d.user.role;$('who').textContent=me;$('login').classList.add('hide');$('app').classList.remove('hide');if(role==='admin')$('admin').classList.remove('hide');await users();let st=await api('/api/socket-token');sock=io({auth:{token:st.token}});sock.on('connect',()=>$('status').textContent='Online');sock.on('chat:message',m=>{if(m.fromUser===peer()||m.toUser===peer())render(m)});sock.on('call:signal',signal);sock.on('location:update',x=>alert('Location from '+x.from+'\\n'+x.lat+', '+x.lng));}catch(e){alert(e.message)}}
async function users(){let a=await api('/api/users');$('peer').innerHTML=a.map(x=>`<option value="${x.username}">${x.displayName||x.username}</option>`).join('');if(role==='admin')$('users').innerHTML=a.map(x=>`<div class="panel">${x.username} — ${x.disabled?'disabled':'active'} <button onclick="toggle('${x.username}',${!x.disabled})">${x.disabled?'Enable':'Disable'}</button></div>`).join('')}
async function addUser(){await api('/api/users',{method:'POST',body:JSON.stringify({username:$('nu').value,password:$('np').value,displayName:$('nd').value})});$('nu').value=$('np').value=$('nd').value='';users()}
async function toggle(u,v){await api('/api/users/'+encodeURIComponent(u),{method:'PATCH',body:JSON.stringify({disabled:v})});users()}
function peer(){return $('peer').value}
async function openChat(){$('messages').innerHTML='';(await api('/api/messages/'+encodeURIComponent(peer()))).forEach(render)}
function render(m){let d=document.createElement('div');d.className='bubble '+(m.fromUser===me?'me':'');d.textContent=(m.fromUser===me?'You':m.fromUser)+': '+m.text;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight}
function send(){let t=$('msg').value.trim();if(t){sock.emit('chat:send',{to:peer(),text:t});$('msg').value=''}}
async function upload(){let f=$('file').files[0];if(!f)return;let fd=new FormData();fd.append('file',f);let d=await api('/api/upload',{method:'POST',body:fd});sock.emit('chat:send',{to:peer(),text:'📎 '+d.filename+' — '+location.origin+d.url});$('file').value=''}
async function call(video){localStream=await navigator.mediaDevices.getUserMedia({audio:true,video});peerConn=new RTCPeerConnection();localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream));peerConn.onicecandidate=e=>e.candidate&&sock.emit('call:signal',{to:peer(),data:{candidate:e.candidate}});let o=await peerConn.createOffer();await peerConn.setLocalDescription(o);sock.emit('call:signal',{to:peer(),data:o});alert('Call sent.')}
async function signal(x){if(x.data?.type==='offer'){if(!confirm(x.from+' is calling. Answer?'))return;localStream=await navigator.mediaDevices.getUserMedia({audio:true,video:true});peerConn=new RTCPeerConnection();localStream.getTracks().forEach(t=>peerConn.addTrack(t,localStream));peerConn.onicecandidate=e=>e.candidate&&sock.emit('call:signal',{to:x.from,data:{candidate:e.candidate}});await peerConn.setRemoteDescription(x.data);let a=await peerConn.createAnswer();await peerConn.setLocalDescription(a);sock.emit('call:signal',{to:x.from,data:a}); }else if(x.data?.type==='answer')await peerConn?.setRemoteDescription(x.data);else if(x.data?.candidate)await peerConn?.addIceCandidate(x.data.candidate)}
function shareLoc(){navigator.geolocation?.getCurrentPosition(p=>sock.emit('location:share',{to:peer(),lat:p.coords.latitude,lng:p.coords.longitude}),()=>alert('Location permission denied'))}
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}
</script></body></html>
